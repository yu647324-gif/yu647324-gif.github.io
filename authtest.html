<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="robots" content="noindex"><meta name="viewport" content="width=device-width,initial-scale=1"><title>login test</title></head>
<body style="font:16px sans-serif;padding:16px">
<button id="p">popup</button> <button id="r">redirect</button> <button id="o">sign out</button>
<pre id="out">loading…</pre>
<script type="module">
import { initializeApp } from 'https://www.gstatic.com/firebasejs/12.13.0/firebase-app.js';
import { getAuth, GoogleAuthProvider, signInWithPopup, signInWithRedirect, getRedirectResult, onAuthStateChanged, signOut } from 'https://www.gstatic.com/firebasejs/12.13.0/firebase-auth.js';
const app = initializeApp({ apiKey: 'AIzaSyDO9lorCu36DFE1J8Vtlz9PoGbtVvHHs2A', authDomain: 'yu647324-gif.github.io', projectId: 'yamato-crm-a3261', appId: '1:12693476471:web:c213799f821b4bfc302272' });
const auth = getAuth(app); const out = document.getElementById('out');
const log = m => { out.textContent += '\n' + m; console.log('[AT] ' + m); };
getRedirectResult(auth).then(r => log('redirectResult: ' + (r ? 'OK' : 'none'))).catch(e => log('redirectErr: ' + e.code));
onAuthStateChanged(auth, u => log('state: ' + (u ? 'SIGNED_IN verified=' + u.emailVerified : 'signed out')));
const pr = () => { const p = new GoogleAuthProvider(); p.setCustomParameters({ prompt: 'select_account' }); return p; };
document.getElementById('p').onclick = () => signInWithPopup(auth, pr()).then(() => log('popup OK')).catch(e => log('popupErr: ' + e.code));
document.getElementById('r').onclick = () => signInWithRedirect(auth, pr()).catch(e => log('redirErr: ' + e.code));
document.getElementById('o').onclick = () => signOut(auth).then(() => log('signed out'));
out.textContent = 'ready';
</script></body></html>
